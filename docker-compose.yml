version: '3.8'

services:
  app1:
    build: .
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  app2:
    build: .
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
